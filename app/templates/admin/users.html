{% extends "base.html" %}
{% block title %}Manage Users | Admin{% endblock %}

{% block content %}
<div class="chapter"><h1>Users</h1></div>

<table class="admin-table">
  <thead>
    <tr><th>ID</th><th>Username</th><th>Email</th><th>Recipes</th><th>Joined</th><th></th></tr>
  </thead>
  <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td><a href="{{ url_for('users.profile_page', username=u.username) }}">{{ u.username }}</a></td>
        <td>{{ u.email }}</td>
        <td>{{ u.recipes.count() }}</td>
        <td>{{ u.created_at.strftime("%Y-%m-%d") }}</td>
        <td>
          <form method="post"
                action="{{ url_for('admin.delete_user', user_id=u.id) }}"
                onsubmit="return confirm('Delete this user and all their content?');">
            <button class="btn btn--sm btn--danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
